services:
  postgres:
    image: postgres:16-alpine
    container_name: tickora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tickora
    ports:
      - '5432:5432'
    volumes:
      - tickora_postgres_data:/var/lib/postgresql/data

volumes:
  tickora_postgres_data:
